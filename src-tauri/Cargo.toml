[package]
name = "monitor-dashboard"
version = "0.6.10"
description = "Desktop media monitor with local analytics and shared workroom"
authors = ["Monitor Dashboard"]
edition = "2024"

[lib]
name = "monitor_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate", "deflate64"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
jsonschema = { version = "0.56.0", default-features = false }

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

regex = "1.11"
