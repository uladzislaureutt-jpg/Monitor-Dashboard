name: L-Monitor API collector checks
on:
  pull_request:
    paths:
      - 'backend/supabase/functions/l-news-collector/**'
      - 'backend/supabase/functions/monitor-sync/**'
      - 'src-tauri/migrations/**'
      - 'src-tauri/src/**'
      - 'tests/importer-harness/**'
      - '.github/workflows/l-news-pilot.yml'
      - 'src/components/LNewsAssistant.tsx'
      - 'tests/ui/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=auto backend/supabase/functions/l-news-collector/index.ts
      - run: deno test --node-modules-dir=auto --allow-env --allow-read backend/supabase/functions/l-news-collector/
      - run: deno check --node-modules-dir=auto backend/supabase/functions/monitor-sync/index.ts
      - run: deno test --node-modules-dir=auto backend/supabase/functions/monitor-sync/
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path tests/importer-harness/Cargo.toml

  assistant-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm install --no-save playwright@1.57.0
      - name: Check both assistant panels
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          node_modules/.bin/vite --config tests/ui/vite.config.ts --host 127.0.0.1 > /tmp/assistant-ui-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/ui/check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant2-ui-preview
          path: tests/ui/assistant2-*.png
          if-no-files-found: ignore
