name: Build Monitor Dashboard Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Prepare pinned yt-dlp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          $url = "https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp.exe"
          $out = "src-tauri/binaries/yt-dlp.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          $hash = (Get-FileHash -Path $out -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "66674953fe251b89f4d08c5f0e35e0728679bd67ab3d7d05c0562af101dd3e7a") {
            throw "yt-dlp SHA256 mismatch: $hash"
          }

      - name: Build Tauri Windows installer
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitor-dashboard-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
