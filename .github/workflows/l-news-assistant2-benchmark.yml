name: Assistant 2 / limited comparative shadow benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CURRENTSAPI_API_KEY: ${{ secrets.CURRENTSAPI_API_KEY }}
      CLORO_API_KEY: ${{ secrets.CLORO_API_KEY }}
      THENEWSAPI_API_KEY: ${{ secrets.THENEWSAPI_API_KEY }}
      THE_NEWS_API_KEY: ${{ secrets.THE_NEWS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test provider search without importing cards
        run: node experiments/l-news-assistant2/benchmark.mjs
      - name: Preserve sanitized output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant2-shadow-benchmark-20261126
          path: assistant2-benchmark-output/results.json
          if-no-files-found: warn
