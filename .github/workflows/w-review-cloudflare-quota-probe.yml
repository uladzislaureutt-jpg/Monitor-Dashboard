name: W-Review Cloudflare 4006 diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/supabase/functions/w-review-ai/cloudflare-quota-probe*.mjs'
      - '.github/workflows/w-review-cloudflare-quota-probe.yml'
  push:
    branches: [main]
    paths:
      - 'backend/supabase/functions/w-review-ai/cloudflare-quota-probe*.mjs'
      - '.github/workflows/w-review-cloudflare-quota-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w-review-cloudflare-quota-probe
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/cloudflare-quota-probe.test.mjs

  live:
    if: github.event_name != 'pull_request'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare 3 ultra-short calls and optionally 2 bounded 512-token calls
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node --experimental-strip-types backend/supabase/functions/w-review-ai/cloudflare-quota-probe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: w-review-cloudflare-4006-probe-${{ github.run_number }}
          path: out/cloudflare-4006-probe/
          retention-days: 7
