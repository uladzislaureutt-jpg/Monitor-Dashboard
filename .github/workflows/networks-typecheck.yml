name: Networks / lightweight contracts
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/networks.test.mjs'
      - '.github/workflows/networks-typecheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  networks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node --experimental-strip-types --test tests/networks.test.mjs
