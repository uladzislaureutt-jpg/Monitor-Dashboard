name: W-Review evidence and dossier checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/supabase/functions/w-review-ai/**'
      - 'src/wReviewAi.ts'
      - 'src/wReviewSourceLabels.ts'
      - 'src-tauri/src/report.rs'
      - 'src/views/WReviewView.tsx'
      - 'src/wReviewEvidenceProgress.ts'
      - 'src/wReviewEvidenceCheckpoint.ts'
      - 'src/wReviewReanalysis.test.mjs'
      - 'src/wReviewEvidenceCheckpoint.test.mjs'
      - '.github/workflows/w-review-evidence-v2.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify Gemini 3.5 routing and generation payload
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/gemini-routing.test.mjs
      - name: Verify Gemini Evidence response integrity and fast fallback
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/gemini-evidence-runtime.test.mjs
      - name: Test strict non-LLM recovery of complete Evidence JSON cards
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/evidence-json-recovery.test.mjs
      - name: Verify bounded preparation and extraction regression protection
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/preparation.test.mjs
      - name: Check cross-batch Gemini circuit
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/provider-circuit.test.mjs
      - name: Validate anchored evidence
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/evidence-v2.test.mjs
      - name: Validate editorial dossier and coverage
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/editorial-dossier.test.mjs
      - name: Verify privacy-safe dossier quality metrics on actual Evidence structures
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/dossier-quality-metrics.test.mjs
      - name: Guard runtime import of dossier Evidence index
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/dossier-runtime-imports.test.mjs
      - name: Verify source-anchored dossier reconciliation
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/dossier-reconciliation.test.mjs
      - name: Verify unified synthesis plan and block diagnostics
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/synthesis-blocks.test.mjs
      - name: Verify bounded Cloudflare/Gemini parallel hedge and Groq budget preflight
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/dossier-provider-hedge.test.mjs
      - name: Check extended Cloudflare primary timeouts and reserved provider windows
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/cloudflare-budget.test.mjs
      - name: Verify dual CF120 + Gemini routing for Evidence, dossier and two reviews
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/dual-routing.test.mjs
      - name: Verify synthesis runtime and timeout guards
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/synthesis-guard.test.mjs
      - name: Verify compact editorial media-review contract and 17 percent overaim
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/editorial-synthesis-contract.test.mjs
      - name: Verify exact-quote inventories and one-pass author-style diagnostics
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/editorial-quotes.test.mjs
      - name: Verify all publisher headlines are available independently of tagged Evidence
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/editorial-headlines.test.mjs
      - name: Verify technical publication reallocation is evidence-safe
        run: node --experimental-strip-types --test src/wReviewEditorialDistribution.test.mjs
      - name: Verify account-owned cloud synchronization cannot overwrite another PC
        run: node --experimental-strip-types --test src/wReviewCloud.test.mjs
      - name: Validate source-label attribution and single-pass length
        run: node --experimental-strip-types --test backend/supabase/functions/w-review-ai/review-output-guard.test.mjs
      - name: Test export of saved W-Review source labels
        run: node --experimental-strip-types --test src/wReviewSourceLabels.test.mjs
      - name: Verify partial Evidence checkpoints, missing-only resume and full rerun
        run: node --experimental-strip-types --test src/wReviewReanalysis.test.mjs src/wReviewEvidenceCheckpoint.test.mjs
      - name: Verify whole-paragraph author-style sampling
        run: node --experimental-strip-types --test src/wReviewStyle.test.mjs
      - name: Verify synchronized Windows title and package version
        run: node --test src/wReviewVersion.test.mjs
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Type-check desktop client
        run: npm run check
